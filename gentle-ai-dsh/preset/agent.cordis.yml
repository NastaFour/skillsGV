# The `gentle-ai` agent preset: the Gentle-AI ecosystem orchestrator on DeepSeek Harness.
#
# Base = the shipped `code` preset (Code Mode / run_code + the standard coding
# agent). On top of it this preset adds what Gentle-AI configures on every other
# agent it supports: a teaching orchestrator persona, Spec-Driven Development
# (SDD) phase skills, flash-model delegation, Judgment Day review, Engram
# (memory) and Context7 (docs) over MCP, and self-authoring (the cordis toolset
# so this agent can author other agents/presets).
#
# This file is an AGENT-PLANE composition, mounted once per preset under a
# standing scope and joined by every session naming it. The host composition
# keeps the registries, sandbox, approval stack, persistence, and model route.
# A service row here MUST sit inside a group carrying an `isolate` realm; the
# preset roster rejects a row that publishes into the root realm.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are Gentle-AI, an ecosystem-orchestrator agent running on the DeepSeek
      Harness. Your model is {{model}}; your workspace is {{cwd}}.

      Plan first, then delegate. Follow Spec-Driven Development (SDD): run
      sdd-init → sdd-explore → sdd-propose before implementing, loading each
      `sdd-*` skill and delegating the phase to its dedicated sub-agent. Before
      shipping non-trivial work, run `judgment-day` (blind dual adversarial
      review) and follow `rdd-defect-workflow` for bounded review evidence.

      You are the COORDINATOR, not an executor. Load the gentle-orchestrator
      skill for the full delegation + retry protocol and the 20-agent roster.
      Delegate the real work; only small mechanical fixes (1 file, no pending
      design) may be done inline. Two delegation tools carry the model routing:
      subagent / subagent_fork run on a cheap "flash" model for mechanical SDD
      phases (spec, tasks, apply, archive); subagent_strong keeps the strong model
      for propose, design, verify, Judgment Day judges, and reviewers. If a
      sub-agent fails or returns empty/invalid, RE-LAUNCH it once with more
      context and investigate why — never assume. You stay on the strong model
      for planning and synthesis. Persist durable context to Engram (memory) and
      consult Context7 for library/framework documentation before writing against
      unfamiliar APIs.

      You may author new agents/presets by writing `agent.cordis.yml`
      compositions under ${DSH_HOME:-~/.dsh}/.agent-presets/<id>/; never edit the
      shipped presets. Technical artifacts default to English.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────
# The skill registry is layered per scope. `skill-filesystem` contributes the
# default roots (project .agents + ~/.agents/skills), which is where Gentle-AI's
# skillsGV catalog lives; `tool-skill` exposes the catalog and loader.

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── MCP: Engram memory + Context7 docs ─────────────────────────────────────
# Each row bridges one MCP server; tools appear as mcp__<serverName>__<tool>.
# Rows are disabled until their env vars are set, so the preset always mounts.
# Set failOnStartupError to true in your copy if you want strict all-or-nothing.

- id: mcp-engram
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: !!js "!process.env.ENGRAM_MCP_COMMAND"
  config:
    serverName: engram
    transport: stdio
    command: !!js process.env.ENGRAM_MCP_COMMAND
    args: !!js "(() => { try { return JSON.parse(process.env.ENGRAM_MCP_ARGS || '[]'); } catch { return []; } })()"
    env: {}
    cwd: !!js process.env.ENGRAM_MCP_CWD || process.cwd()
    toolCallTimeoutMs: 120000
    failOnStartupError: false
    reconnect:
      enabled: true

- id: mcp-context7
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: context7
    transport: streamable-http
    url: !!js process.env.CONTEXT7_MCP_URL || 'https://mcp.context7.com/mcp'
    toolCallTimeoutMs: 120000
    failOnStartupError: false
    reconnect:
      enabled: true

- id: mcp-open-design
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: open-design
    transport: stdio
    command: 'C:\Users\j1347\AppData\Local\Programs\Open Design\Open Design.exe'
    args:
      - 'C:\Users\j1347\AppData\Local\Programs\Open Design\resources\app\prebundled\daemon\daemon-cli.mjs'
      - mcp
    env:
      OD_DATA_DIR: 'C:\Users\j1347\AppData\Roaming\Open Design\namespaces\release-stable-win\data'
      OD_SIDECAR_IPC_PATH: '\\.\pipe\open-design-release-stable-win-daemon'
      OD_MCP_BOOTSTRAP_COMMAND: 'C:\Users\j1347\AppData\Local\Programs\Open Design\Open Design.exe'
      OD_MCP_BOOTSTRAP_ARGS: '["--headless"]'
      ELECTRON_RUN_AS_NODE: '1'
    toolCallTimeoutMs: 120000
    failOnStartupError: false
    reconnect:
      enabled: true

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────
# The subagents registry and its spawn/fork backends live in the HOST
# composition. This preset contributes the delegation TOOLS. The subagent and
# subagent_fork rows carry `agentOptions` so delegated work runs on the flash
# model (env-configurable), while the orchestrator itself stays on the strong
# model. Add a second, strong-model subagent instance for Judgment Day reviewers
# if you want adversarial review on the strong model too.

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
        maxDepth: 3
        agentOptions:
          provider: !!js process.env.DSH_FLASH_PROVIDER || 'deepseek-official'
          model: !!js process.env.DSH_FLASH_MODEL || 'deepseek-v4-flash'
          maxTokens: 16000

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
        maxDepth: 3
        agentOptions:
          provider: !!js process.env.DSH_FLASH_PROVIDER || 'deepseek-official'
          model: !!js process.env.DSH_FLASH_MODEL || 'deepseek-v4-flash'
          maxTokens: 16000

    - id: tool-subagent-strong
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_strong
        backgroundMode: continuable
        maxDepth: 3
        agentOptions:
          provider: !!js process.env.DSH_STRONG_PROVIDER || 'deepseek-official'
          model: !!js process.env.DSH_STRONG_MODEL || 'deepseek-v4-pro'

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── self-modification ───────────────────────────────────────────────────────
# The cordis toolset: read the live runtime, mount a temporary plugin, unmount
# it, and author new agent presets. This is a TRUST BOUNDARY, not a sandbox —
# Disabled by default — enable only when you need self-authoring (shell access).

# tool-cordis (self-authoring) is OPT-IN — shell-access trust boundary.
# To enable it, uncomment the row below (mirrors the shipped "cordis" preset).
# - id: tool-cordis
#   name: '@deepseek-ai/dsh-tool-cordis'

# ── presentation ────────────────────────────────────────────────────────────

- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: code
