name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Validate (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build addon mirror
        run: pnpm build:addon

      - name: Validate catalog specification (Strict)
        run: pnpm validate:strict

      - name: Run unit and integration tests
        run: pnpm test

      - name: Run addon mirror tests
        run: pnpm test:addon

      - name: Run catalog doctor health checks
        run: pnpm doctor

      - name: Run routing and context benchmark
        run: pnpm benchmark

