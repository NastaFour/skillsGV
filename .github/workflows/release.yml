name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict skill validator
        run: pnpm validate:strict

      - name: Run offline test suite
        run: pnpm test

      - name: Run addon mirror build & tests
        run: pnpm test:addon

      - name: Run catalog doctor
        run: pnpm doctor

      - name: Run harness benchmark
        run: pnpm benchmark --markdown > BENCHMARK_REPORT.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag) || github.ref_name }}
          generate_release_notes: true
          body_path: BENCHMARK_REPORT.md
          draft: false
          prerelease: false
